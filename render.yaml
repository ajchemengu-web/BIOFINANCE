services:
  - type: web
    name: biofinance-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # set from the Render Postgres instance's connection string
      - key: JWT_SECRET
        generateValue: true
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_SHORTCODE
        sync: false
      - key: DARAJA_PASSKEY
        sync: false
      - key: DARAJA_ENVIRONMENT
        value: sandbox
      - key: DARAJA_CALLBACK_BASE_URL
        sync: false # set to this service's own public URL once deployed
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to your Vercel deployment URL(s), comma-separated — "*" works for an early demo

# databases:
#   Uncomment once ready to provision Render's managed Postgres, then point
#   DATABASE_URL above at its connection string.
#   - name: biofinance-db
#     plan: free
